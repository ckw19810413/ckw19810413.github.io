mainSections = ['post']
rssFullContent = true
favicon = 'favicon.ico'
dateFormat = { published = '2006-01-02', lastUpdated = '2006-01-02' }

# SEO
description = 'Practical, evergreen guides on money, productivity, and the web — 理財、生產力、開發者工具的實用長青指南'

[sidebar]
  subtitle = 'Practical, evergreen guides on money, productivity, and the web'
  [sidebar.avatar]
    src = "avatar.png"

[widgets]
  homepage = [
      { type = 'search' },
      { type = 'archives', params = { limit = 5 } },
      { type = 'categories', params = { limit = 10 } },
      { type = 'tag-cloud', params = { limit = 10 } },
  ]
  page = [{ type = 'toc' }]

[comment]
  enabled = false

[colorScheme]
  toggle = true
  default = 'auto'

[imageProcessing]
  content = { enabled = true }
  thumbnail = { enabled = true }

# OpenGraph
[opengraph]
  [opengraph.twitter]
    site = 'slashmantools'
    card = 'summary_large_image'
